# SLO recording rules and multi-window burn-rate alerts. See docs/slo.md.
groups:
  - name: chioma_slo_recording
    rules:
      - record: slo:error_ratio:rate5m
        labels:
          journey: platform
        expr: |
          sum(rate(http_requests_total{route=~".*",status_class="5xx"}[5m]))
          /
          clamp_min(sum(rate(http_requests_total{route=~".*"}[5m])), 1e-9)
      - record: slo:error_ratio:rate30m
        labels:
          journey: platform
        expr: |
          sum(rate(http_requests_total{route=~".*",status_class="5xx"}[30m]))
          /
          clamp_min(sum(rate(http_requests_total{route=~".*"}[30m])), 1e-9)
      - record: slo:error_ratio:rate1h
        labels:
          journey: platform
        expr: |
          sum(rate(http_requests_total{route=~".*",status_class="5xx"}[1h]))
          /
          clamp_min(sum(rate(http_requests_total{route=~".*"}[1h])), 1e-9)
      - record: slo:error_ratio:rate6h
        labels:
          journey: platform
        expr: |
          sum(rate(http_requests_total{route=~".*",status_class="5xx"}[6h]))
          /
          clamp_min(sum(rate(http_requests_total{route=~".*"}[6h])), 1e-9)
      - record: slo:error_ratio:rate3d
        labels:
          journey: platform
        expr: |
          sum(rate(http_requests_total{route=~".*",status_class="5xx"}[3d]))
          /
          clamp_min(sum(rate(http_requests_total{route=~".*"}[3d])), 1e-9)
      - record: slo:error_ratio:rate5m
        labels:
          journey: search
        expr: |
          sum(rate(http_requests_total{route=~"/api/(v[0-9]+/)?(search|properties).*",status_class="5xx"}[5m]))
          /
          clamp_min(sum(rate(http_requests_total{route=~"/api/(v[0-9]+/)?(search|properties).*"}[5m])), 1e-9)
      - record: slo:error_ratio:rate30m
        labels:
          journey: search
        expr: |
          sum(rate(http_requests_total{route=~"/api/(v[0-9]+/)?(search|properties).*",status_class="5xx"}[30m]))
          /
          clamp_min(sum(rate(http_requests_total{route=~"/api/(v[0-9]+/)?(search|properties).*"}[30m])), 1e-9)
      - record: slo:error_ratio:rate1h
        labels:
          journey: search
        expr: |
          sum(rate(http_requests_total{route=~"/api/(v[0-9]+/)?(search|properties).*",status_class="5xx"}[1h]))
          /
          clamp_min(sum(rate(http_requests_total{route=~"/api/(v[0-9]+/)?(search|properties).*"}[1h])), 1e-9)
      - record: slo:error_ratio:rate6h
        labels:
          journey: search
        expr: |
          sum(rate(http_requests_total{route=~"/api/(v[0-9]+/)?(search|properties).*",status_class="5xx"}[6h]))
          /
          clamp_min(sum(rate(http_requests_total{route=~"/api/(v[0-9]+/)?(search|properties).*"}[6h])), 1e-9)
      - record: slo:error_ratio:rate3d
        labels:
          journey: search
        expr: |
          sum(rate(http_requests_total{route=~"/api/(v[0-9]+/)?(search|properties).*",status_class="5xx"}[3d]))
          /
          clamp_min(sum(rate(http_requests_total{route=~"/api/(v[0-9]+/)?(search|properties).*"}[3d])), 1e-9)
      - record: slo:error_ratio:rate5m
        labels:
          journey: booking
        expr: |
          sum(rate(http_requests_total{route=~"/api/(v[0-9]+/)?(agreements|rent|sublet).*",status_class="5xx"}[5m]))
          /
          clamp_min(sum(rate(http_requests_total{route=~"/api/(v[0-9]+/)?(agreements|rent|sublet).*"}[5m])), 1e-9)
      - record: slo:error_ratio:rate30m
        labels:
          journey: booking
        expr: |
          sum(rate(http_requests_total{route=~"/api/(v[0-9]+/)?(agreements|rent|sublet).*",status_class="5xx"}[30m]))
          /
          clamp_min(sum(rate(http_requests_total{route=~"/api/(v[0-9]+/)?(agreements|rent|sublet).*"}[30m])), 1e-9)
      - record: slo:error_ratio:rate1h
        labels:
          journey: booking
        expr: |
          sum(rate(http_requests_total{route=~"/api/(v[0-9]+/)?(agreements|rent|sublet).*",status_class="5xx"}[1h]))
          /
          clamp_min(sum(rate(http_requests_total{route=~"/api/(v[0-9]+/)?(agreements|rent|sublet).*"}[1h])), 1e-9)
      - record: slo:error_ratio:rate6h
        labels:
          journey: booking
        expr: |
          sum(rate(http_requests_total{route=~"/api/(v[0-9]+/)?(agreements|rent|sublet).*",status_class="5xx"}[6h]))
          /
          clamp_min(sum(rate(http_requests_total{route=~"/api/(v[0-9]+/)?(agreements|rent|sublet).*"}[6h])), 1e-9)
      - record: slo:error_ratio:rate3d
        labels:
          journey: booking
        expr: |
          sum(rate(http_requests_total{route=~"/api/(v[0-9]+/)?(agreements|rent|sublet).*",status_class="5xx"}[3d]))
          /
          clamp_min(sum(rate(http_requests_total{route=~"/api/(v[0-9]+/)?(agreements|rent|sublet).*"}[3d])), 1e-9)
      - record: slo:error_ratio:rate5m
        labels:
          journey: payment
        expr: |
          sum(rate(http_requests_total{route=~"/api/(v[0-9]+/)?(payments|escrow|stellar|transactions).*",status_class="5xx"}[5m]))
          /
          clamp_min(sum(rate(http_requests_total{route=~"/api/(v[0-9]+/)?(payments|escrow|stellar|transactions).*"}[5m])), 1e-9)
      - record: slo:error_ratio:rate30m
        labels:
          journey: payment
        expr: |
          sum(rate(http_requests_total{route=~"/api/(v[0-9]+/)?(payments|escrow|stellar|transactions).*",status_class="5xx"}[30m]))
          /
          clamp_min(sum(rate(http_requests_total{route=~"/api/(v[0-9]+/)?(payments|escrow|stellar|transactions).*"}[30m])), 1e-9)
      - record: slo:error_ratio:rate1h
        labels:
          journey: payment
        expr: |
          sum(rate(http_requests_total{route=~"/api/(v[0-9]+/)?(payments|escrow|stellar|transactions).*",status_class="5xx"}[1h]))
          /
          clamp_min(sum(rate(http_requests_total{route=~"/api/(v[0-9]+/)?(payments|escrow|stellar|transactions).*"}[1h])), 1e-9)
      - record: slo:error_ratio:rate6h
        labels:
          journey: payment
        expr: |
          sum(rate(http_requests_total{route=~"/api/(v[0-9]+/)?(payments|escrow|stellar|transactions).*",status_class="5xx"}[6h]))
