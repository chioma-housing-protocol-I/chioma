        labels:
          journey: payment
        expr: |
          sum(rate(http_requests_total{route=~"/api/(v[0-9]+/)?(payments|escrow|stellar|transactions).*",status_class="5xx"}[3d]))
          /
          clamp_min(sum(rate(http_requests_total{route=~"/api/(v[0-9]+/)?(payments|escrow|stellar|transactions).*"}[3d])), 1e-9)

  - name: chioma_slo_burn_rate_alerts
    rules:
      - alert: SLOErrorBudgetBurnFast_platform
        expr: |
          slo:error_ratio:rate1h{journey="platform"} > 0.072
          and
          slo:error_ratio:rate5m{journey="platform"} > 0.072
        for: 2m
        labels:
          severity: critical
          component: slo
          journey: platform
        annotations:
          summary: "platform SLO (99.5%) error budget burning at 14.4x"
          description: "Error ratio over 1h and 5m exceeds 14.4x the platform error budget."
          runbook_url: "https://github.com/chioma-housing-protocol-I/chioma/blob/main/docs/slo.md"
      - alert: SLOErrorBudgetBurnMedium_platform
        expr: |
          slo:error_ratio:rate6h{journey="platform"} > 0.03
          and
          slo:error_ratio:rate30m{journey="platform"} > 0.03
        for: 15m
        labels:
          severity: critical
          component: slo
          journey: platform
        annotations:
          summary: "platform SLO (99.5%) error budget burning at 6x"
          description: "Error ratio over 6h and 30m exceeds 6x the platform error budget."
          runbook_url: "https://github.com/chioma-housing-protocol-I/chioma/blob/main/docs/slo.md"
      - alert: SLOErrorBudgetBurnSlow_platform
        expr: |
          slo:error_ratio:rate3d{journey="platform"} > 0.005
          and
          slo:error_ratio:rate6h{journey="platform"} > 0.005
        for: 1h
        labels:
          severity: warning
          component: slo
          journey: platform
        annotations:
          summary: "platform SLO (99.5%) error budget burning at 1x"
          description: "Error ratio over 3d and 6h exceeds 1x the platform error budget."
          runbook_url: "https://github.com/chioma-housing-protocol-I/chioma/blob/main/docs/slo.md"
      - alert: SLOErrorBudgetBurnFast_search
        expr: |
          slo:error_ratio:rate1h{journey="search"} > 0.0144
