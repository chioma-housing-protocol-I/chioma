name: Contract CI

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "contract/**"
      - ".github/workflows/contract-ci-cd.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "contract/**"
      - ".github/workflows/contract-ci-cd.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IS_PR: ${{ github.event_name == 'pull_request' }}

jobs:
  contract-build:
    name: Contract build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        # toolchain is intentionally omitted; version is read from contract/rust-toolchain.toml
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          working-directory: contract

      - name: Cargo build
        run: cargo build --release

  contract-fmt:
    name: Contract fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        # toolchain is intentionally omitted; version is read from contract/rust-toolchain.toml
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          working-directory: contract

      - name: Cargo format check
        run: cargo fmt --all -- --check

  contract-clippy:
    name: Contract clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        # toolchain is intentionally omitted; version is read from contract/rust-toolchain.toml
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          working-directory: contract

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  contract-tests:
    name: Contract tests
    runs-on: ubuntu-latest
    needs: [contract-build, contract-fmt, contract-clippy]
    defaults:
      run:
        working-directory: contract
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        # toolchain is intentionally omitted; version is read from contract/rust-toolchain.toml
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          working-directory: contract

      - name: Run tests
        run: cargo test --all
