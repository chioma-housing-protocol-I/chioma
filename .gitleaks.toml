# Gitleaks Configuration
title = "Gitleaks secret scanning config"

[allowlist]
description = "Global allowlist for test fixtures, mocks, and documentation examples"
paths = [
  '''(?i)test/.*''',
  '''(?i)tests/.*''',
  '''(?i).*\.spec\.(ts|js)''',
  '''(?i).*\.test\.(ts|js)''',
  '''(?i)docs/.*''',
  '''(?i)README\.md''',
  '''(?i)DEMO_CREDENTIALS\.md'''
]
regexes = [
  '''(?i)example''',
  '''(?i)placeholder''',
  '''(?i)your[-_]secret''',
  '''(?i)dummy''',
  '''(?i)mock''',
  '''(?i)test''',
  '''(?i)xxxx''',
  '''(?i)0000000000000000''',
  '''(?i)change_me'''
]

[[rules]]
id = "aws-access-key-id"
description = "AWS Access Key ID"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["key", "AWS"]

[[rules]]
id = "aws-secret-access-key"
description = "AWS Secret Access Key"
regex = '''(?i)(aws_secret_access_key|aws_secret_key)\s*[:=]\s*['"]?([A-Za-z0-9\/+=]{40})['"]?'''
tags = ["key", "AWS"]

[[rules]]
id = "stellar-secret-key"
description = "Stellar Secret Key (S...)"
regex = '''S[A-Z2-7]{55}'''
tags = ["key", "Stellar"]

[[rules]]
id = "private-key-block"
description = "Private Key Block"
regex = '''-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'''
tags = ["key", "Private Key"]

[[rules]]
id = "jwt-secret-hardcoded"
description = "Hardcoded JWT Secret"
regex = '''(?i)(jwt_secret|jwtsecret|jwt_key)\s*[:=]\s*['"]?([^'"\s\n]{10,})['"]?'''
tags = ["secret", "JWT"]

[[rules]]
id = "database-password"
description = "Hardcoded Database Password / URL"
regex = '''(?i)(DATABASE_URL|DB_PASSWORD|POSTGRES_PASSWORD)\s*[:=]\s*['"]?([^'"\s\n]{8,})['"]?'''
tags = ["secret", "Database"]
